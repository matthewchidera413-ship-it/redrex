<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="heart512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9a9e"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <filter id="glow512" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg512)"/>
  <!-- Outer glow ring -->
  <circle cx="256" cy="256" r="184" fill="none" stroke="url(#heart512)" stroke-width="8" opacity="0.35"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.25"/>
  <!-- Main heart -->
  <path d="M256 332 c-70 0 -112 -48 -112 -108 0 -60 76 -124 112 -38 38 -84 -112 -38 -38 112 0 -60 -76 -22 -112 -108 -108 -108" fill="url(#heart512)" filter="url(#glow512)"/>
  <!-- Inner highlight heart -->
  <path d="M256 288 c-38 0 -60 -26 -60 -60 0 -32 38 -70 60 -22 22 -44 -48 60 -22 60 0 -22 -38 -28 -60 -60" fill="#ffffff" opacity="0.35"/>
  <!-- Small orbit hearts -->
  <circle cx="168" cy="210" r="22" fill="#ffb7ce" opacity="0.9"/>
  <circle cx="346" cy="316" r="16" fill="#a855f7" opacity="0.9"/>
  <circle cx="342" cy="188" r="14" fill="#ffffff" opacity="0.8"/>
  <!-- Sparkles -->
  <circle cx="400" cy="120" r="7" fill="#ffffff"/>
  <circle cx="112" cy="400" r="5" fill="#ffffff"/>
  <circle cx="186" cy="80" r="4" fill="#ffffff"/>
  <circle cx="420" cy="380" r="3" fill="#ffffff"/>
  <circle cx="90" cy="100" r="4" fill="#ffffff"/>
</svg>
